name: Bug report
description: Report a reproducible DisplayRecall problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove private window titles, document names, accounts, and unrelated desktop content from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: DisplayRecall version or commit
      placeholder: v0.1.7 or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.2, MacBook Pro M4
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Include resolutions, scaling, arrangement, rotation, menu bar display, and Dock position.
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Affected applications
      description: Prefer bundle identifiers; do not include private document titles.
      placeholder: com.openai.codex
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Review logs before sharing them publicly.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private window titles, document names, accounts, and unrelated desktop content.
          required: true
